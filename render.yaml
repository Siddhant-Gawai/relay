services:
  - type: web
    name: relay-webhook-reliability
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: relay
      - key: RELAY_ENCRYPTION_KEY
        sync: false
      - key: RELAY_AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RELAY_PUBLIC_ORIGIN
        sync: false
      - key: RELAY_ALLOW_PRIVATE_DESTINATIONS
        value: "false"

